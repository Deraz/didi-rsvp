<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Farida is turning ONE! ☀️</title>
  <meta name="description" content="A little sunshine is turning ONE — join us for Farida's 1st birthday! Friday 28th August, 6:30 PM, Family Park, El Rehab." />
  <meta name="theme-color" content="#FFC93C" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="sky-decor" aria-hidden="true">
    <span class="cloud cloud-1"></span>
    <span class="cloud cloud-2"></span>
    <span class="cloud cloud-3"></span>
    <span class="cloud cloud-4"></span>
    <span class="balloon balloon-1"></span>
    <span class="balloon balloon-2"></span>
    <span class="balloon balloon-3"></span>
    <span class="balloon balloon-4"></span>
  </div>

  <header class="hero">
    <div class="hero-daisies" aria-hidden="true"></div>
    <p class="hero-kicker">A little sunshine is turning</p>
    <div class="hero-one" aria-label="ONE">
      <span class="hero-o">
        <img src="assets/theme/face.png" alt="Farida smiling" />
        <span class="party-hat" aria-hidden="true"></span>
      </span><span class="hero-n">N</span><span class="hero-e">E</span>
    </div>
    <h1 class="hero-title">Farida’s 1st Birthday</h1>
    <p class="hero-sub"><span class="script">our little sunshine</span> ☀️</p>
  </header>

  <main>
    <section id="countdown" aria-label="Countdown to the party">
      <h2 class="section-title"><span aria-hidden="true">✳</span> counting down <span aria-hidden="true">✳</span></h2>
      <div class="count-grid" role="timer">
        <div class="count-chip"><span class="count-num" id="cd-days">–</span><span class="count-label">days</span></div>
        <div class="count-chip"><span class="count-num" id="cd-hours">–</span><span class="count-label">hours</span></div>
        <div class="count-chip"><span class="count-num" id="cd-minutes">–</span><span class="count-label">minutes</span></div>
        <div class="count-chip"><span class="count-num" id="cd-seconds">–</span><span class="count-label">seconds</span></div>
      </div>
      <p class="count-until">until Didi turns ONE!</p>
      <p class="count-done" hidden>It’s party time! 🎉☀️</p>
    </section>
    <section id="details" aria-label="Party details"></section>
    <section id="photos" aria-label="Photo moments"></section>
    <section id="rsvp" aria-label="RSVP"></section>
  </main>

  <footer class="footer">made with ☀️ for Farida</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
